name: Publish

# ─────────────────────────────────────────────────────────────────────────────
# Publishes `@mudraid/sidecar` to npm — sibling of the adapter-node publish.yml
# and npm counterpart of the PyPI publish.yml pattern shipped with the two
# Python packages. Same shape throughout: lives in the monorepo, mirrored into
# the public repository alongside the package; dry-run by default; the upload
# sits behind the `npm-publish` environment approval; a requested publish without
# an OIDC identity is a loud refusal, never a skip; and the support-matrix row
# flips only on a recorded upload receipt, never on this run going green.
#
# TWO CHANNELS, ONE VERSION. The support matrix lists this package on the
# `oci` channel — the Dockerfile image built by adapter-release.yml is the
# primary distribution — and this workflow governs the npm tarball, the
# compiled runtime form. Both carry the same package.json version; neither channel's
# row moves except on its own receipt.
#
# The candidate bundles the reviewed decision-core source shipped in the
# snapshot. No sibling checkout is required after installing the tarball.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload to npm (requires the npm-publish environment approval and npm Trusted Publishing). Anything else is a dry run."
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build and pack the same compiled candidate inspected below.
      - name: Typecheck and pack
        run: |
          npm ci
          npm run typecheck
          mkdir -p dist-tarball
          npm pack --pack-destination dist-tarball

      - uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: dist-tarball/

  checks:
    name: Tarball contents and dependency audit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: dist-tarball/

      # Inspect the compiled artifact downloaded from the build job.
      - name: Inspect what the tarball actually contains
        run: node .github/inspect_tarball.mjs contents dist-tarball

      # Production dependencies only — what a customer's install resolves, not
      # the dev toolchain. (Currently zero runtime dependencies; the step is
      # the statement that this stays audited, not assumed.)
      - name: Audit the shipped dependency set
        run: npm audit --omit=dev --audit-level=low

  test:
    name: Test on Node ${{ matrix.node-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every current release line `engines: node>=20` admits, exercised;
      # fail-fast off so a single-version break reports as one.
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run the suite
        run: |
          npm ci
          npm test

      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: dist-tarball/

      - name: Qualify the installed compiled runtime
        run: node .github/check_installed.mjs dist-tarball

      - name: Generate SBOM
        if: matrix.node-version == '20'
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.json

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '20'
        with:
          name: sbom
          path: sbom.json

  publish:
    name: Publish (approval required)
    needs: [test, checks]
    runs-on: ubuntu-latest
    # The approval gate, mirroring the Python packages' `pypi-publish`
    # environment. npm blocks re-publishing a version number even after
    # unpublish, so nothing reaches the registry without a human approving
    # this environment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install the OIDC-capable publishing CLI
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: dist-tarball/

      # Publishing remains an explicit owner-approved action.
      - name: Preflight the release candidate
        env:
          PUBLISH_INTENT: ${{ inputs.publish == true }}
        run: node .github/inspect_tarball.mjs preflight dist-tarball

      # Check presence only; never print or persist the OIDC request credential.
      # npm validates the configured repository/workflow/environment on publish.
      - name: Require the Actions OIDC identity
        if: inputs.publish == true
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::Publishing requires GitHub Actions OIDC (id-token: write) and an npm Trusted Publisher for this repository, publish.yml, and npm-publish environment. Nothing was published."
            exit 1
          fi

      - name: Dry run (default)
        if: inputs.publish != true
        run: |
          echo "Dry run: nothing is uploaded. The preflight above is the full"
          echo "statement of what a real publish would do. To publish for real:"
          echo "  1. resolve every preflight blocker in a reviewed commit"
          echo "     (including qualifying the bundled decision core),"
          echo "  2. dispatch with publish=true,"
          echo "  3. approve the npm-publish environment when prompted,"
          echo "  4. record the upload receipt in sdks/support-matrix.json —"
          echo "     the row flips on the receipt, not on this run going green."

      # Publish THE artifact the other jobs proved — the downloaded tarball,
      # never a rebuild. --provenance publishes a Sigstore attestation binding
      # the tarball to this repository, workflow and run.
      - name: Publish to npm (OIDC and provenance)
        if: inputs.publish == true
        run: npm publish "$(readlink -f dist-tarball/*.tgz)" --provenance --access public

      - name: The receipt to record
        if: inputs.publish == true
        run: |
          echo "Published. Now write the receipt into sdks/support-matrix.json:"
          echo "  recorded_upload.version      = the version just uploaded"
          echo "  recorded_upload.registry_url = https://www.npmjs.com/package/@mudraid/sidecar"
          echo "  recorded_upload.uploaded_at  = $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "  recorded_upload.workflow     = this workflow, npm-publish environment approval"
          echo "support_status flips from 'prerelease' in THAT commit — on the receipt, not the vibe."
